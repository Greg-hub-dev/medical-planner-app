name: Build installers

# Construit les installeurs de bureau :
#   - .exe (NSIS) sur un runner Windows
#   - .dmg sur un runner macOS
# Les fichiers sont téléchargeables dans l'onglet "Artifacts" du run, et — quand on
# pousse un tag v… (ex. v0.1.0) — attachés à une Release GitHub (liens permanents).

on:
  push:
    branches: ['master', 'main', 'build/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022 embarque Visual Studio 2022, que le node-gyp d'@electron/rebuild
          # sait détecter. windows-latest a basculé sur VS 18 (2026), non reconnu → échec.
          - os: windows-2022
            artifact: memomed-windows-exe
            pattern: dist/*.exe
          # Deux runners macOS natifs : macos-15-intel est Intel (x64), macos-latest
          # est Apple Silicon (arm64). Construire sur chacun évite de cross-compiler
          # le module natif better-sqlite3, et fournit un .dmg par type de Mac.
          # (macos-13 a été retiré par GitHub : le job restait en attente sans fin.)
          - os: macos-15-intel
            artifact: memomed-macos-dmg-intel
            pattern: dist/*.dmg
          - os: macos-latest
            artifact: memomed-macos-dmg-apple-silicon
            pattern: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-gyp (compilation de better-sqlite3 pour l'ABI Electron) a besoin de Python.
      - name: Setup Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist
        env:
          # Pas de signature de code : produit un installeur non signé.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  # Sur un tag v… : récupère les installeurs et les publie dans une Release GitHub.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
